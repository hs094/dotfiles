onboarding = false

[keys]
prefix = "ctrl+a"
# Indexed navigation
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
focus_agent = "ctrl+1..9"

# Split — tmux style
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"

# Detach — tmux default
detach = "prefix+d"

# Copy/scroll mode — tmux default
copy_mode = "prefix+["

# Tab navigation (defaults — same as tmux)
next_tab = "prefix+n"
previous_tab = "prefix+p"

# Workspace navigation (unbound by default)
previous_workspace = "prefix+up"
next_workspace = "prefix+down"

# Agent cycling (unbound by default)
next_agent = "ctrl+alt+n"
previous_agent = "ctrl+alt+p"

# Workspace/tab rename — tmux style
rename_workspace = "prefix+$"
rename_tab = "prefix+,"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+alt+g"
type = "plugin_action"
command = "kukv.github-dash.open"
description = "open GitHub pull requests and issues"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "gh-pr.refresh"
description = "refresh PR status"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "gh-pr.open-pr"
description = "open PR in browser"

[[keys.command]]
key = "ctrl+shift+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "Agent Usage: open limits pane"

[[keys.command]]
key = "ctrl+shift+m"
type = "plugin_action"
command = "usagebar.refresh"
description = "Agent Usage: refresh sidebar meters"

[ui]
agent_panel_sort = "spaces"
prompt_new_tab_name = false
prompt_new_workspace_name = false

[ui.toast]
delivery = "off"

[ui.sidebar.agents]
row_gap = 1
rows = [
  # Context window usage
  [
    { token = "$context", fg = "#89b4fa" }
  ],

  # Cache performance
  [
    { token = "$cache_high", fg = "#a6e3a1" },
    { token = "$cache_mid", fg = "#e0af68" },
    { token = "$cache_low", fg = "#f7768e", bold = true }
  ],

  # Provider and quota
  [
    { token = "$provider", fg = "#a6e3a1" },
    { token = "$limit", bold = true }
  ],

  # Agent name and status
  [
    "state_icon",
    { token = "agent", bold = true, fg = "#89b4fa" },
    { token = "state_text", dim = true }
  ]
]

[experimental]
pane_history = true
kitty_graphics = true
