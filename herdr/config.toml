onboarding = false

[keys]
prefix = "ctrl+a"


# Indexed navigation
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
focus_agent = "ctrl+1..9"

# Split — tmux style
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"

# Detach — tmux default
detach = "prefix+d"

# Copy/scroll mode — tmux default
copy_mode = "prefix+["

# Tab navigation (defaults — same as tmux)
next_tab = "ctrl+n"
previous_tab = "ctrl+p"

# Workspace navigation (unbound by default)
previous_workspace = "prefix+up"
next_workspace = "prefix+down"

# Agent cycling (unbound by default)
next_agent = "ctrl+alt+n"
previous_agent = "ctrl+alt+p"

# Workspace/tab rename — tmux style
rename_workspace = "prefix+$"
rename_tab = "prefix+,"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# [[keys.command]]
# key = "prefix+i"
# type = "plugin_action"
# command = "gh-pr.refresh"
# description = "refresh PR status"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "gh-pr.open-pr"
description = "open PR in browser"


[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "herdr-github.toggle"
description = "PR and issue panel"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

[theme]
name = "catppuccin"
auto_switch = false

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"


# ==========================================
# HERDR UI — CATPPUCCIN MOCHA
# ==========================================
[ui]
# Agent ordering
agent_panel_sort = "spaces"
status_indicators = "symbols"
# Fast workspace and tab creation
prompt_new_tab_name = false
prompt_new_workspace_name = false
confirm_close = true
# Sidebar
sidebar_width = 38
sidebar_min_width = 24
sidebar_max_width = 48
sidebar_start_collapsed = false
sidebar_collapsed_mode = "compact"
# Terminal responsiveness
mobile_width_threshold = 64
redraw_on_focus_gained = true
# Mouse interaction
mouse_capture = true
mouse_scroll_lines = 3
copy_on_select = true
# Pane appearance
pane_borders = "auto"
pane_outer_borders = true
pane_gaps = true
pane_scrollbars = false
# Agent identification
show_agent_labels_on_pane_borders = true
# Tab bar
tab_bar_position = "top"
hide_tab_bar_when_single_tab = true
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%H:%M" }
]
tab_bar_right_separator = "  "
# Terminal title
window_title = "{workspace}: {tab}"
# Catppuccin Mocha accent
accent = "#89b4fa"



# ==========================================
# AGENTS SIDEBAR
# ==========================================
[ui.sidebar.agents]
row_gap = 1
rows = [
  # Agent name, state, limits
  [
    "state_icon",
    { token = "agent", fg = "#a6e3a1", bold = true },
    { token = "state_text", dim = true, rules = [
      { equals = "working", fg = "#a6e3a1", bold = true, dim = false },
      { equals = "blocked", fg = "#f38ba8", bold = true, dim = false },
      { equals = "done", fg = "#89b4fa", dim = false },
      { equals = "idle", fg = "#6c7086", dim = true }
    ] }
  ],
  # Workspace name
  [
    { token = "workspace", fg = "#89b4fa", bold = true }
  ],
]


# ==========================================
# SPACES SIDEBAR
# ==========================================
[ui.sidebar.spaces]
row_gap = 0
rows = [
  # Workspace and agent activity
  [
    "state_icon",
    { token = "workspace", fg = "#89b4fa", bold = true }
  ],
  # Git branch and ahead/behind
  [
    { token = "branch", fg = "#cba6f7" },
    "git_status"
  ],
  # Custom dirty/untracked status
  [
    { token = "$git_changes", fg = "#f9e2af" }
  ]
]


[experimental]
kitty_graphics = true
