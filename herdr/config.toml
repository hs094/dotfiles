onboarding = false

[keys]
prefix = "ctrl+a"
# Indexed navigation
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
focus_agent = "ctrl+1..9"

# Split — tmux style
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"

# Detach — tmux default
detach = "prefix+d"

# Copy/scroll mode — tmux default
copy_mode = "prefix+["

# Tab navigation (defaults — same as tmux)
next_tab = "ctrl+n"
previous_tab = "ctrl+p"

# Workspace navigation (unbound by default)
previous_workspace = "prefix+up"
next_workspace = "prefix+down"

# Agent cycling (unbound by default)
next_agent = "ctrl+alt+n"
previous_agent = "ctrl+alt+p"

# Workspace/tab rename — tmux style
rename_workspace = "prefix+$"
rename_tab = "prefix+,"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# [[keys.command]]
# key = "prefix+i"
# type = "plugin_action"
# command = "gh-pr.refresh"
# description = "refresh PR status"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "gh-pr.open-pr"
description = "open PR in browser"

[[keys.command]]
key = "ctrl+shift+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "Agent Usage: open limits pane"

[[keys.command]]
key = "ctrl+shift+m"
type = "plugin_action"
command = "usagebar.refresh"
description = "Agent Usage: refresh sidebar meters"

[ui]
agent_panel_sort = "spaces"
prompt_new_tab_name = false
prompt_new_workspace_name = false

status_indicators = "symbols"

[theme]
name = "catppuccin"
auto_switch = false

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"


[experimental]
kitty_graphics = true

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "herdr-github.toggle"
description = "PR and issue panel"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"
